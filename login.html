<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaLearn — เข้าสู่ระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login" class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-icon">📖</span>
        <span class="brand-name">LinguaLearn</span>
      </div>
      <p class="auth-sub">เรียนภาษาอังกฤษตามระดับ CEFR พร้อม Word Battle</p>

      <p class="auth-error" id="auth-error"></p>

      <form id="login-form" class="auth-form">
        <label for="login-username">ชื่อผู้ใช้</label>
        <input type="text" id="login-username" required autocomplete="username" />
        <label for="login-password">รหัสผ่าน</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        <p class="auth-switch">ยังไม่มีบัญชี? <button type="button" id="show-register" class="auth-link">สมัครสมาชิก</button></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label for="register-displayname">ชื่อที่แสดง</label>
        <input type="text" id="register-displayname" required maxlength="60" />
        <label for="register-username">ชื่อผู้ใช้ (ภาษาอังกฤษ/ตัวเลข)</label>
        <input type="text" id="register-username" required maxlength="30" autocomplete="username" />
        <label for="register-password">รหัสผ่าน (อย่างน้อย 4 ตัว)</label>
        <input type="password" id="register-password" required minlength="4" autocomplete="new-password" />
        <label for="register-confirm">ยืนยันรหัสผ่าน</label>
        <input type="password" id="register-confirm" required minlength="4" autocomplete="new-password" />
        <button type="submit" class="btn btn-primary">สมัครสมาชิก</button>
        <p class="auth-switch">มีบัญชีอยู่แล้ว? <button type="button" id="show-login" class="auth-link">เข้าสู่ระบบ</button></p>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stats-store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
