<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaLearn — เข้าสู่ระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login" class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-icon">📖</span>
        <span class="brand-name">LinguaLearn</span>
      </div>
      <p class="auth-sub">เรียนภาษาอังกฤษตามระดับ CEFR พร้อม Word Battle</p>

      <p class="auth-error" id="auth-error"></p>

      <form id="login-form" class="auth-form">
        <label for="login-email">อีเมล</label>
        <input type="email" id="login-email" required autocomplete="email" />
        <label for="login-password">รหัสผ่าน</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        <p class="auth-switch"><button type="button" id="show-forgot" class="auth-link">ลืมรหัสผ่าน?</button></p>
        <p class="auth-switch">ยังไม่มีบัญชี? <button type="button" id="show-register" class="auth-link">สมัครสมาชิก</button></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label for="register-displayname">ชื่อที่แสดง</label>
        <input type="text" id="register-displayname" required maxlength="60" />
        <label for="register-email">อีเมล</label>
        <input type="email" id="register-email" required autocomplete="email" />
        <label for="register-password">รหัสผ่าน (อย่างน้อย 6 ตัว)</label>
        <input type="password" id="register-password" required minlength="6" autocomplete="new-password" />
        <label for="register-confirm">ยืนยันรหัสผ่าน</label>
        <input type="password" id="register-confirm" required minlength="6" autocomplete="new-password" />
        <button type="submit" class="btn btn-primary">สมัครสมาชิก</button>
        <p class="auth-switch">มีบัญชีอยู่แล้ว? <button type="button" id="show-login" class="auth-link">เข้าสู่ระบบ</button></p>
      </form>

      <form id="forgot-form" class="auth-form hidden">
        <p class="auth-sub" style="margin-top:0">กรอกอีเมลที่ใช้สมัคร ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้</p>
        <label for="forgot-email">อีเมล</label>
        <input type="email" id="forgot-email" required autocomplete="email" />
        <button type="submit" class="btn btn-primary">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
        <p class="auth-switch"><button type="button" id="show-login-from-forgot" class="auth-link">กลับไปหน้าเข้าสู่ระบบ</button></p>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stats-store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
